name: Release macOS

on:
  push:
    tags:
      - 'v*'
  # Publishing a release on github.com (Releases > Draft a new release > new tag) also builds it;
  # the DMGs are then uploaded into that release.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish (for example v1.3.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  # A release made on github.com creates its tag too, which fires the tag-push trigger as well.
  # That push run stands down when the release already exists, so each version builds once.
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "push" ] && gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            skip=true
            echo "Release ${{ github.ref_name }} already exists; its release event builds it."
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.426'
      - name: Verify release version
        run: |
          python3 - <<'PY'
          import os, plistlib, xml.etree.ElementTree as ET
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          assert ET.parse('src/TableEdit.csproj').findtext('.//Version') == version
          with open('packaging/Info.plist', 'rb') as stream:
              plist = plistlib.load(stream)
          assert plist['CFBundleVersion'] == version
          assert plist['CFBundleShortVersionString'] == version
          PY
      - name: Build, sign and verify Apple Silicon and Intel DMGs
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: python3 packaging/package_macos.py --dmg
      - name: Smoke-test native macOS application startup
        run: python3 packaging/smoke_macos.py
      - name: Verify and name release assets
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          checksums = []
          for arch in ('arm64', 'x64'):
              target = Path(f'dist/TableEdit-{version}-macos-{arch}.dmg')
              assert target.is_file() and target.stat().st_size > 1_000_000
              checksums.append(f'{hashlib.sha256(target.read_bytes()).hexdigest()}  {target.name}\n')
          Path('dist/SHA256SUMS.txt').write_text(''.join(checksums))
          status = Path('dist/macos-signing-status.txt').read_text().strip()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(f'Signing: {status}\n\nBoth DMGs passed checksum, mount, version, and code-signature verification.\n')
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${RELEASE_TAG#v}"
          notes="packaging/releases/${RELEASE_TAG}.md"
          release_notes="$RUNNER_TEMP/tableedit-release-notes.md"
          args=(--generate-notes)
          if [ -f "$notes" ]; then
            cp "$notes" "$release_notes"
            args=(--notes-file "$release_notes")
          else
            touch "$release_notes"
            args+=(--notes-file "$release_notes")
          fi
          printf '\n## Build signing status\n\n' >> "$release_notes"
          cat dist/macos-signing-status.txt >> "$release_notes"
          assets=("dist/TableEdit-${version}-macos-arm64.dmg" "dist/TableEdit-${version}-macos-x64.dmg" dist/SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Made on github.com: add the DMGs to it, and use the repository's notes when there are some.
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            if [ -f "$notes" ]; then
              gh release edit "$RELEASE_TAG" --title "TableEdit $RELEASE_TAG" --notes-file "$release_notes"
            fi
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --title "TableEdit $RELEASE_TAG" "${args[@]}"
          fi
